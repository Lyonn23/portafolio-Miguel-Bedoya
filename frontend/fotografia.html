<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotografía — Miguel Bedoya</title>
  <meta name="description" content="Galería de fotografía profesional: retrato, naturaleza, paisaje y composición editorial por Miguel Bedoya.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Michroma&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syncopate:wght@400;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="icon" href="assets/logo.png" type="image/png">
</head>
<body data-track="foto">

  <canvas id="particle-canvas" style="position: fixed; inset: 0; pointer-events: none; z-index: 0;"></canvas>
  <div class="reg-square reg-square--left" aria-hidden="true"></div>
  <div class="reg-square reg-square--right" aria-hidden="true"></div>
  <div id="site-nav"></div>

  <main>
    <section class="section" style="padding-top: calc(var(--nav-h) + var(--space-5));" id="fotografia">
      <div class="container">
        <span class="eyebrow">02 — Óptica &amp; Dirección Visual</span>
        <h1 class="section-title">Luz, encuadre, instante</h1>
        <p class="section-lede" id="foto-intro"></p>

        <!-- Equipo y Óptica -->
        <div style="margin-top: var(--space-4); margin-bottom: 0.75rem;">
          <span class="eyebrow" style="font-size: 11px;">Cámara &amp; Software</span>
        </div>
        <ul class="chip-row" id="foto-equipo" style="margin-bottom: var(--space-4);"></ul>

        <!-- Galería con Lightbox -->
        <div class="section__head" style="margin-top: var(--space-4);">
          <span style="font-family: var(--font-mono); font-size: 13px; color: var(--c-red);">[ Clic en cualquier imagen para abrir en alta resolución ]</span>
        </div>
        <div class="gallery" id="foto-galeria"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/particles.js" defer></script>
  <script src="js/render.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/antiinspect.js" defer></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initParticles('particle-canvas');
    });
  </script>
</body>
</html>
