<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotografía — Miguel Bedoya</title>
  <meta name="description" content="Galería de fotografía profesional: retrato, naturaleza, paisaje y composición editorial por Miguel Bedoya.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&family=Unbounded:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="icon" href="assets/logo.png" type="image/png">
</head>
<body data-track="foto">

  <canvas id="particle-canvas" style="position: fixed; inset: 0; pointer-events: none; z-index: 1;"></canvas>
  <div id="site-nav"></div>

  <main>
    <section class="section" style="padding-top: calc(var(--nav-h) + var(--space-5)); position: relative;">
      <div class="hud-marker hud-marker--tl"></div>
      <div class="hud-marker hud-marker--tr"></div>

      <div class="container">
        <span class="eyebrow">02 — Óptica &amp; Dirección Visual</span>
        <h1 class="section-title" data-reveal>Luz, encuadre, instante.</h1>
        <p class="section-lede" id="foto-intro" data-reveal data-reveal-delay="80"></p>

        <!-- Equipo y Óptica -->
        <div class="section__head" style="margin-top: var(--space-4); margin-bottom: var(--space-2);">
          <div>
            <span class="eyebrow">Óptica &amp; Software</span>
            <h2 class="section-title" style="font-size: var(--fs-h2);">Equipo Técnico</h2>
          </div>
        </div>

        <ul class="chip-row" id="foto-equipo" data-reveal data-reveal-delay="120"></ul>
      </div>
    </section>

    <!-- Galería con Lightbox Interactivo -->
    <section class="section section--tight">
      <div class="container">
        <div class="section__head">
          <div>
            <span class="eyebrow">Exposición</span>
            <h2 class="section-title" style="font-size: var(--fs-h2);">Galería Seleccionada</h2>
          </div>
          <span style="font-family: var(--font-mono); font-size: 0.78rem; color: var(--crimson-light);">[ Clic en cualquier foto para ampliar ]</span>
        </div>

        <div class="gallery" id="foto-galeria"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/particles.js" defer></script>
  <script src="js/render.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/antiinspect.js" defer></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initParticles('particle-canvas', {
        density: 16000,
        maxParticles: 75,
        colorRgb: '255, 75, 105'
      });
    });
  </script>
</body>
</html>
