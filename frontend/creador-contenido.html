<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creación de Contenido — Miguel Bedoya</title>
  <meta name="description" content="Estrategia, narrativa y producción de contenido viral para redes sociales por Miguel Bedoya.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&family=Unbounded:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="icon" href="assets/logo.png" type="image/png">
</head>
<body data-track="content">

  <canvas id="particle-canvas" style="position: fixed; inset: 0; pointer-events: none; z-index: 1;"></canvas>
  <div id="site-nav"></div>

  <main>
    <section class="section" style="padding-top: calc(var(--nav-h) + var(--space-5)); position: relative;">
      <div class="hud-marker hud-marker--tl"></div>
      <div class="hud-marker hud-marker--tr"></div>

      <div class="container">
        <span class="eyebrow">03 — Audiencias &amp; Formatos</span>
        <h1 class="section-title" data-reveal>Ideas hechas para la pantalla.</h1>
        <p class="section-lede" id="content-intro" data-reveal data-reveal-delay="80"></p>

        <!-- Métricas / Plataformas -->
        <div class="section__head" style="margin-top: var(--space-5); margin-bottom: var(--space-2);">
          <div>
            <span class="eyebrow">Audiencia</span>
            <h2 class="section-title" style="font-size: var(--fs-h2);">Comunidad &amp; Redes</h2>
          </div>
        </div>

        <div class="stats" id="content-plataformas"></div>
      </div>
    </section>

    <!-- Piezas Destacadas -->
    <section class="section section--tight">
      <div class="container">
        <div class="section__head">
          <div>
            <span class="eyebrow">Campañas</span>
            <h2 class="section-title" style="font-size: var(--fs-h2);">Piezas de Alto Rendimiento</h2>
          </div>
        </div>

        <div class="grid" id="content-piezas"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/particles.js" defer></script>
  <script src="js/render.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/antiinspect.js" defer></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initParticles('particle-canvas', {
        density: 16000,
        maxParticles: 75,
        colorRgb: '255, 55, 95'
      });
    });
  </script>
</body>
</html>
