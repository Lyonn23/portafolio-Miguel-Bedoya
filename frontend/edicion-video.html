<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edición de Video — Miguel Bedoya</title>
  <meta name="description" content="Edición audiovisual profesional, color grading, montaje de ritmo y post-producción por Miguel Bedoya.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Michroma&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syncopate:wght@400;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="icon" href="assets/logo.png" type="image/png">
</head>
<body data-track="video">

  <canvas id="particle-canvas" style="position: fixed; inset: 0; pointer-events: none; z-index: 0;"></canvas>
  <div class="reg-square reg-square--left" aria-hidden="true"></div>
  <div class="reg-square reg-square--right" aria-hidden="true"></div>
  <div id="site-nav"></div>

  <main>
    <section class="section" style="padding-top: calc(var(--nav-h) + var(--space-5));" id="video">
      <div class="container">
        <span class="eyebrow">04 — Post-Producción &amp; Montaje</span>
        <h1 class="section-title">Ritmo, corte, color</h1>
        <p class="section-lede" id="video-intro"></p>

        <!-- Suite de Edición -->
        <div style="margin-top: var(--space-4); margin-bottom: 0.75rem;">
          <span class="eyebrow" style="font-size: 11px;">Suite de Edición</span>
        </div>
        <ul class="chip-row" id="video-herramientas" style="margin-bottom: var(--space-4);"></ul>

        <!-- Reproductores de Video Reales -->
        <div class="section__head" style="margin-top: var(--space-4);">
          <div>
            <span class="eyebrow">Producciones Audiovisuales</span>
            <h2 class="section-title" style="font-size: var(--fs-h2);">Cortes &amp; Comerciales</h2>
          </div>
        </div>
        <div class="grid" id="video-proyectos"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/particles.js" defer></script>
  <script src="js/render.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/antiinspect.js" defer></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initParticles('particle-canvas');
    });
  </script>
</body>
</html>
